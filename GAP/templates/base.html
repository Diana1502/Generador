{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GAP{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="stylesheet" href="{% static 'css/gnrl.css' %}">
    <link rel="stylesheet" href="{% static 'css/loader.css' %}">
</head>
<body
    data-section="{{ numero }}"
    data-seccion-actual="{{ cuestionario.seccion_actual }}"
    data-urls='{
        "municipios": "{% url "apps.cuestionarios:cargar_municipios" %}"
        }'>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <img src="/static/img/LOGO-ICONO.png">

            <a class="navbar-brand fw-bold" href="{%url 'apps.cuestionarios:dashboard' %}">Generador de Avisos de Privacidad</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                         {% if request.user.is_authenticated %}
                            <span class="nav-link text-light" style="cursor: default;">{{ request.user.username }}</span>
                        {% else %}
                            <a class="nav-link active" href="{% url 'apps.usuarios:login' %}">Iniciar sesión</a>
                        {% endif %}
                    </li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'apps.usuarios:logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="nav-link btn btn-link ">
                                <i class="bi bi-door-open-fill"></i>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <br>
    <div class="container mt-4">
        <div id="message-container" class="message-container"></div>

        {% block content %}
        {% endblock %}
    </div>


    {% load static %}

    <script
        src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"
        type="module">
    </script>

    <script type="module" src="{% static 'js/main.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
