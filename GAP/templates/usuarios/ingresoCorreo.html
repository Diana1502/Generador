{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - GAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="img-container">
        <img src="{% static 'img/LOGO DATOS PERSONALES-01.png' %}">
    </div>
    <div class="auth-container">
        <h2>Recuperar Contraseña</h2>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mt-3">Enviar correo de recuperación</button>
        </form>

        <br>
        <a href="{% url 'apps.usuarios:login' %}">Volver al inicio de sesión</a>
    </div>
</body>
</html>
